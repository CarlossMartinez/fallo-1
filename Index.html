<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Index.css" />
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
  </head>
  <body>
    <div class="Cartas">
      <div>
        <h1 class="titulo">¡Feliz Navidad!</h1>
      </div>
      <div class="grid">
        <div class="grid-sizer">
          <img
            src="https://dedadi.com/wp-content/uploads/2015/03/GCC_1-2.jpg"
            alt="img 1"
          />
          <p>El mejor adorno de Navidad es una gran sonrisa ¡Feliz Navidad!</p>
        </div>
        <div class="grid-item">
          <img
            src="https://slidechef.net/wp-content/uploads/2021/09/Christmas-Greeting-Google-Slides.jpg"
            alt="Imagen 2"
          />
          <p>La Navidad es el día que une todos los tiempos.</p>
        </div>
        <div class="grid-item grid-item--width2">
          <img
            src="https://i.pinimg.com/originals/b7/e1/d8/b7e1d84702fd207505f22408f37350fc.jpg"
            alt="Imagen 3"
          />
          <p>
            Aunque el tiempo transcurra deprisa, la Navidad nos deja instantes
            eternos.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
